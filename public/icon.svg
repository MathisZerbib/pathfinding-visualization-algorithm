<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #0ea5e9; }
      .path { fill: #06b6d4; }
      .nodes { fill: #fbbf24; }
      .text { fill: white; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0c4a6e; }
      .path { fill: #0ea5e9; }
      .nodes { fill: #f59e0b; }
      .text { fill: white; }
    }
  </style>
  
  <!-- Background -->
  <rect class="background" width="180" height="180" rx="37" />
  
  <!-- Grid pattern (subtle) -->
  <g opacity="0.1">
    <line x1="45" y1="30" x2="45" y2="150" stroke="white" stroke-width="1"/>
    <line x1="75" y1="30" x2="75" y2="150" stroke="white" stroke-width="1"/>
    <line x1="105" y1="30" x2="105" y2="150" stroke="white" stroke-width="1"/>
    <line x1="135" y1="30" x2="135" y2="150" stroke="white" stroke-width="1"/>
    <line x1="30" y1="45" x2="150" y2="45" stroke="white" stroke-width="1"/>
    <line x1="30" y1="75" x2="150" y2="75" stroke="white" stroke-width="1"/>
    <line x1="30" y1="105" x2="150" y2="105" stroke="white" stroke-width="1"/>
    <line x1="30" y1="135" x2="150" y2="135" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Path/Route (zigzag pathfinding visualization) -->
  <path class="path" 
    d="M 40 60 L 55 60 L 55 75 L 70 75 L 70 60 L 85 60 L 85 90 L 100 90 L 100 75 L 115 75 L 115 105 L 130 105 L 130 120 L 145 120" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    fill="none"
    stroke="#06b6d4"
    opacity="0.8"/>
  
  <!-- Start node (circle with location pin style) -->
  <g class="nodes">
    <circle cx="40" cy="60" r="12" />
    <circle cx="40" cy="60" r="6" fill="white"/>
  </g>
  
  <!-- End node (target/flag style) -->
  <g class="nodes">
    <circle cx="145" cy="120" r="12" />
    <path d="M 145 115 L 145 125 M 138 118 L 145 115 L 152 118" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Explored nodes (small dots along alternative paths) -->
  <g class="nodes" opacity="0.4">
    <circle cx="70" cy="90" r="4" />
    <circle cx="100" cy="105" r="4" />
    <circle cx="85" cy="120" r="4" />
    <circle cx="115" cy="90" r="4" />
  </g>
</svg>